name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # The GUI tests need an X display.
      - run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: pip install -r requirements.txt ruff==0.16.9
      - run: ruff check .
      - run: ruff format --check .
      - run: xvfb-run -a pytest -q
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
